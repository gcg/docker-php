x-app: &app
  build: .
  volumes:
    - .:/var/www/html
  depends_on:
    - postgres
    - redis

x-env: &env
  APP_ENV: local
  # Source is live-mounted, so skip config/route/view caching
  RUN_OPTIMIZATIONS: "false"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: laravel
  DB_USERNAME: laravel
  DB_PASSWORD: secret
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  app:
    <<: *app
    ports:
      - "8080:8080"
    environment:
      <<: *env
      APP_DEBUG: "true"
      CONTAINER_ROLE: web

  queue:
    <<: *app
    environment:
      <<: *env
      CONTAINER_ROLE: worker

  scheduler:
    <<: *app
    environment:
      <<: *env
      CONTAINER_ROLE: scheduler

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
