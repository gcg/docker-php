[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/proc/self/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/self/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=10

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/proc/self/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/self/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=5
