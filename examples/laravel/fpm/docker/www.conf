[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager configuration
; 'dynamic' is recommended for most workloads with predictable traffic
; 'ondemand' is optimal for low memory environments / dev
; 'static' is optimal for maximum throughput under constant load
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Health check and status paths
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Pass environment variables to PHP workers
clear_env = no

; Catch output from worker processes and route to stderr
catch_workers_output = yes
decorate_workers_output = no

; Access log format
access.format = "[%t] %m %{REQUEST_SCHEME}e://%{HTTP_HOST}e%{REQUEST_URI}e pid:%p took:%ds mem:%{mega}Mmb cpu:%C%% status:%s"
